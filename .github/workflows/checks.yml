name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Unit tests also exercise browser rendering and encoded frame output.
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm test
  browser-and-media:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          FRAMESCRIPT_TEST_PRODUCTION: "1"
      - run: npm run test:server
      - run: npm run test:integration
      - run: npm run test:workflow
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/browser-run
          retention-days: 7
